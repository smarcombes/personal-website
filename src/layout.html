<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta
      name="description"
      content="{{description}}"
    />
    <link rel="canonical" href="{{url}}" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f5f4ef" />

    <meta property="og:type" content="{{ogType}}" />
    <meta property="og:title" content="{{title}}" />
    <meta
      property="og:description"
      content="{{description}}"
    />
    <meta property="og:url" content="{{url}}" />
{{ogImage}}    <meta name="twitter:card" content="{{twitterCard}}" />

    <link
      rel="preload"
      href="/fonts/newsreader-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
{{preloadBodyFont}}    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body
    class="bg-background text-foreground font-mono text-sm leading-5 antialiased"
  >
    <div class="p-4 md:p-12 overflow-hidden">
      <div class="w-full {{width}}">
        <header
          class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4"
        >
          <span>
            <a href="/" class="text-3xl font-serif">Hey, I'm Séverin.</a>
          </span>
        </header>
{{content}}
        <footer>
          <div
            class="w-full flex flex-col md:flex-row justify-between py-6 items-baseline gap-4 border-t border-black mt-16"
          >
            <p class="font-serif text-lg">Séverin Marcombes</p>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
