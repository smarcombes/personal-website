        <a
          href="/"
          class="inline-flex items-center gap-1 text-xs text-muted-foreground underline underline-offset-2 decoration-foreground/20 hover:text-foreground"
        >
          ← Home
        </a>

        <h1
          class="font-serif text-[2.25rem] leading-[1.1] tracking-[-0.02em] text-balance mt-8 mb-4"
        >
          Press
        </h1>
        <p class="text-xs text-muted-foreground mb-8 max-w-2xl">
          A selection of some articles about me or my work.
        </p>

        <!-- ============ LANGUAGE ============ -->
        <div
          class="flex flex-wrap items-center gap-2 bg-white border border-black shadow-card px-3 py-2.5 mb-8"
        >
          <label
            for="press-lang"
            class="font-mono text-[10px] uppercase tracking-[0.14em] text-muted-foreground shrink-0"
          >
            Read in
          </label>
          <select
            id="press-lang"
            class="text-xs bg-background border border-divider px-2 py-1 focus-visible:outline-none"
          >
            <option value="none">Don't translate</option>
            <option value="en" selected>English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="nl">Dutch</option>
            <option value="ru">Russian</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
          </select>
          <span class="text-[11px] text-muted-foreground">
            — titles switch to this language right away; opening an article
            translates it too, if it isn't already in this language.
          </span>
        </div>

        {{press}}

        {{pressTranslations}}

        <!-- ============ SCRIPT ============ -->
        <script>
          (function () {
            var KEY = "press-lang";
            var select = document.getElementById("press-lang");
            if (!select) return;

            var table = {};
            try {
              var node = document.getElementById("press-translations");
              if (node) table = JSON.parse(node.textContent);
            } catch (e) {}

            function applyLanguage(lang) {
              document.querySelectorAll(".press-card-title").forEach(function (title) {
                var id = title.closest("a.press-card").getAttribute("data-id");
                var original = title.getAttribute("data-original");
                var entry = table[id];
                var text = lang !== "none" && entry && entry[lang] ? entry[lang] : original;
                title.textContent = text;
              });
            }

            try {
              var saved = localStorage.getItem(KEY);
              if (saved && [].some.call(select.options, function (o) { return o.value === saved; })) {
                select.value = saved;
              }
            } catch (e) {}

            applyLanguage(select.value);

            select.addEventListener("change", function () {
              try {
                localStorage.setItem(KEY, select.value);
              } catch (e) {}
              applyLanguage(select.value);
            });

            document.querySelectorAll("a.press-card").forEach(function (card) {
              card.addEventListener("click", function (e) {
                var lang = select.value;
                var articleLang = card.getAttribute("data-lang") || "";
                if (lang === "none" || lang === articleLang) return;
                e.preventDefault();
                var url = card.getAttribute("href");
                var translated =
                  "https://translate.google.com/translate?sl=auto&tl=" +
                  encodeURIComponent(lang) +
                  "&u=" +
                  encodeURIComponent(url);
                window.open(translated, "_blank", "noopener,noreferrer");
              });
            });
          })();
        </script>
