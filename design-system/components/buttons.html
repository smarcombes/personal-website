<!--
  COMPONENT: Buttons
  Warm-gray tactile buttons with a dashed inner keyline (after: pseudo-element),
  hard 2px offset shadow, and a physical press on :active.
-->

<!-- Standard button -->
<a
  href="#"
  class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium px-3 py-1.5
         bg-button text-button-foreground border border-button-foreground shadow-btn
         relative after:absolute after:inset-0.5 after:border after:border-dashed after:border-button-foreground after:pointer-events-none
         hover:bg-button-hover hover:text-black
         active:shadow-none active:translate-y-0.5 transition-colors"
>
  Read the post
</a>
