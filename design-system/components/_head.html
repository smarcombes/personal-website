<!--
  Shared <head> boilerplate for all components in this design system.
  Copy this block into any page that uses the components.
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: '#F5F4EF',
          'background-hover': '#EBEAE5',
          foreground: '#000000',
          muted: '#E5E4DC',
          'muted-foreground': '#686868',
          link: '#595959',
          button: { DEFAULT: '#D9D8D3', hover: '#C4C3BB', foreground: '#403E37' },
          divider: '#E5E4DC',
          'card-border': '#D4D3CB',
          'card-border-hover': '#C0BDAD',
          highlight: '#FBD45B',
        },
        fontFamily: {
          serif: ['Newsreader', 'Georgia', 'ui-serif', 'serif'],
          mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],
          sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
        },
        boxShadow: {
          card: '3px 3px 0px #000000',
          'card-hover': '5px 5px 0px #000000',
          'card-soft': '3px 3px 0px #C0BDAD',
          btn: '2px 2px 0px #403E37',
        },
      },
    },
  };
</script>
<!-- Body must carry: class="bg-background text-foreground font-mono text-sm leading-5 antialiased" -->
