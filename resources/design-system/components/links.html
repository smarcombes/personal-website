<!--
  COMPONENT: Links
  Three link styles: nav (tab underline), inline mono, article prose.
-->

<!-- 1. Nav link: underline offset 8px like a tab indicator -->
<a href="#" class="underline underline-offset-8 hover:decoration-2 hover:decoration-foreground/50 hover:text-foreground/70">Nav link</a>
<a href="#" class="underline underline-offset-8 decoration-2 ml-6">Active nav link</a>

<!-- 2. Inline link in mono/UI context: faint underline that nearly vanishes on hover -->
<p class="mt-8">
  Apply under
  <a href="#" class="underline underline-offset-2 decoration-foreground/20 hover:decoration-foreground/5">&lt;insert-job-you-excel-at/&gt;</a>
  to reach us.
</p>

<!-- 3. Article prose link: muted gray (#595959), underline thickens on hover, optional inline icon -->
<p class="font-sans text-lg leading-relaxed mt-8">
  See the
  <a href="#" class="text-link underline hover:decoration-2 inline-flex items-center gap-1">
    <svg class="size-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3h7v7M13 3 3 13"/></svg>
    project repository
  </a>
  for details.
</p>
